name: Update YouTube JSON

on:
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest videos and write youtube.json
        run: |
          python3 - << 'PY'
          import urllib.request, xml.etree.ElementTree as ET, json, datetime

          CHANNEL_ID = "UCb2YuOCgSbbekiZbKieXCvA"
          FEED = f"https://www.youtube.com/feeds/videos.xml?channel_id={CHANNEL_ID}"
          NS = {"a": "http://www.w3.org/2005/Atom",
                "yt": "http://www.youtube.com/xml/schemas/2015"}

          req = urllib.request.Request(FEED, headers={"User-Agent": "Mozilla/5.0"})
          xml = urllib.request.urlopen(req, timeout=30).read()
          root = ET.fromstring(xml)

          videos = []
          for entry in root.findall("a:entry", NS):
              vid = entry.find("yt:videoId", NS).text
              title = entry.find("a:title", NS).text
              published = entry.find("a:published", NS).text
              d = datetime.datetime.fromisoformat(published.replace("Z", "+00:00"))
              videos.append({
                  "id": vid,
                  "title": title,
                  "date": d.strftime("%b %-d, %Y"),
                  "thumbnail": f"https://i.ytimg.com/vi/{vid}/mqdefault.jpg",
              })

          videos = videos[:6]
          with open("youtube.json", "w") as f:
              json.dump(videos, f, indent=2)
          print(f"Wrote {len(videos)} videos")
          PY

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add youtube.json
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "Update youtube.json"
            git push
          fi
